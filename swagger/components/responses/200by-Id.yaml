description: Contact found successfully
content:
  application/json:
    schema:
      type: object
      properties:
        status:
          type: integer
          example: 200
        message:
          type: string
          example: Contact found successfully
        data:
          type: object
          properties:
            _id:
              type: string
              example: '684065c4eee740223c622d92'
            userId:
              type: string
              example: '68406527eee740223c622d8a'
            name:
              type: string
              example: 'Daenerys'
            phoneNumber:
              type: string
              example: '78995212274'
            email:
              type: string
              example: 'drogon@gmail.com'
            isFavourite:
              type: boolean
              example: true
            contactType:
              type: string
              example: home
            createdAt:
              type: string
              format: date-time
              example: '2025-06-04T15:27:00.426Z'
            updatedAt:
              type: string
              format: date-time
              example: '2025-06-06T21:45:23.402Z'
            photo:
              type: string
              example: 'https://res.cloudinary.com/dkbceyoqy/image/upload/v1749469763/ink2frx6ex2mtmoutxlo.png'
